name: ASTRA Zotero - pruebas
on:
  push:
    paths:
      - 'astra-zotero/**'
      - '.github/workflows/astra-zotero.yml'
  pull_request:
    paths:
      - 'astra-zotero/**'
      - '.github/workflows/astra-zotero.yml'
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astra-zotero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v